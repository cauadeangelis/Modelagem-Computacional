# Publica a pasta dist/ no GitHub Pages a cada push na branch main (depois que os testes passam).
# Ative uma vez em: Settings → Pages → Build and deployment → Source: GitHub Actions.
# Repositório privado: o GitHub Pages exige um plano pago (Pro, Team ou Enterprise). Em plano gratuito, deixe o repositório
# público ou publique pelo botão "Run workflow" depois de mudar a visibilidade.
name: Publicar no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  testes:
    uses: ./.github/workflows/testes.yml
  publicar:
    needs: testes
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
